name: Build Brahma AI Windows EXE

on:
  workflow_dispatch: # Actions ట్యాబ్‌లో బటన్ క్లిక్ చేయగానే రన్ అవుతుంది

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pillow

    - name: Generate App Icon
      run: |
        python create_icon.py

    - name: Build Single Folder EXE with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed `
          --icon=app_icon.ico `
          --add-data "services;services" `
          --add-data "app.py;." `
          --add-data "bgm.mp3;." `
          --copy-metadata streamlit `
          --name "Brahma_AI_Studio" `
          run_app.py

    - name: Archive EXE Folder to ZIP
      run: |
        Compress-Archive -Path dist/Brahma_AI_Studio -DestinationPath dist/Brahma_AI_Studio_Windows.zip

    - name: Upload Windows App Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Brahma-AI-Studio-Windows-App
        path: dist/Brahma_AI_Studio_Windows.zip
        retention-days: 7
