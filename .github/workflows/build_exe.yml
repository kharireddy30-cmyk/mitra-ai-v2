name: Build Brahma AI Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Download FFmpeg for Audio Processing
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
        Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_temp
        $binPath = (Get-ChildItem -Path "ffmpeg_temp" -Filter "bin" -Recurse).FullName
        Copy-Item "$binPath\ffmpeg.exe" -Destination "."
        Copy-Item "$binPath\ffprobe.exe" -Destination "."

    - name: Build Windows EXE with PyInstaller
      shell: cmd
      run: |
        pyinstaller --noconfirm --onedir --windowed --icon=speech_icon.ico --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;." --add-data "services;services" --add-data "app.py;." --add-data "bgm.mp3;." --copy-metadata streamlit --collect-all streamlit --collect-all edge_tts --collect-all streamlit_mic_recorder --collect-all speech_recognition --collect-all pydub --collect-all docx --collect-all PIL --name "Brahma_AI_Studio" run_app.py

    - name: Compress Build to ZIP
      shell: pwsh
      run: |
        Compress-Archive -Path dist/Brahma_AI_Studio -DestinationPath dist/Brahma_AI_Studio_Windows.zip

    - name: Upload Windows App Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Brahma-AI-Studio-Windows-App
        path: dist/Brahma_AI_Studio_Windows.zip
        retention-days: 7
